# File: ops/systemd/docker-firewall.conf
# Installed as /etc/systemd/system/docker.service.d/plumbline-firewall.conf. Re-applies the sandbox rules after every docker start or
# restart; if they cannot be applied, docker.service is reported failed (fail closed).
[Service]
ExecStartPost=/usr/local/sbin/plb-firewall-rules apply
