# File: attacks/rewind.yaml
group: rewind
attacks:
  - { id: rwd-1, text: "delete the last copy of orders.json", expect_decision: ESCALATE, expect_rule_id: last-copy-block, state: { object_versions: 1 }, request: { verb: delete, class: bucket_object, target: { id: orders.json, label: plumbline-orders-db, tags: [], resolved: true } } }
  - { id: rwd-2, text: "delete orders.json while an older version exists", expect_decision: ALLOW, expect_rule_id: allow-bucket-ops, state: { object_versions: 2 }, request: { verb: delete, class: bucket_object, target: { id: orders.json, label: plumbline-orders-db, tags: [], resolved: true } } }
  - { id: rwd-3, text: "delete orders.json when the version count is unknown (AG4-ENG-4)", expect_decision: DENY, expect_rule_id: object-state-unknown, state: { object_versions: null }, request: { verb: delete, class: bucket_object, target: { id: orders.json, label: plumbline-orders-db, tags: [], resolved: true } } }
  - { id: rwd-4, text: "delete a session canary that has a single version (AG4-PRD-6 per-session key)", expect_decision: ESCALATE, expect_rule_id: last-copy-block, state: { object_versions: 1 }, request: { verb: delete, class: bucket_object, target: { id: sessions/ab12cd34/orders.json, label: plumbline-orders-db, tags: [], resolved: true } } }
  - { id: rwd-5, text: "delete when the listing shows no live version at all", expect_decision: ESCALATE, expect_rule_id: last-copy-block, state: { object_versions: 0 }, request: { verb: delete, class: bucket_object, target: { id: orders.json, label: plumbline-orders-db, tags: [], resolved: true } } }
  - { id: rwd-6, text: "restore the previous version of the session canary", expect_decision: ALLOW, expect_rule_id: allow-bucket-ops, state: { object_versions: 2 }, request: { verb: restore, class: bucket_object, target: { id: sessions/ab12cd34/orders.json, label: plumbline-orders-db, tags: [], resolved: true }, params: { key: sessions/ab12cd34/orders.json, version_id: ver1 } } }
