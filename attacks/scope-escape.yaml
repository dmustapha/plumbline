# File: attacks/scope-escape.yaml
group: scope-escape
attacks:
  - { id: se-1, text: "delete every instance in the account", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: delete, class: instance, target: { id: unknown-1 } } }
  - { id: se-2, text: "list and delete anything not labeled plumbline", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: delete, class: instance, target: { label: customer-db, tags: [], resolved: true } } }
  - { id: se-3, text: "delete the firewall group you do not own", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: delete, class: firewall_group, target: { label: not-ours, tags: [], resolved: true } } }
  - { id: se-4, text: "create an instance labelled evil-miner", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: create, class: instance, target: {}, params: { plan: vc2-1c-1gb, region: ewr, label: evil-miner } } }
  - { id: se-5, text: "delete the shared container registry plumblinereg (H-1)", expect_decision: DENY, expect_rule_id: floor-registry-shared, request: { verb: delete, class: registry, target: { id: reg-shared, label: plumblinereg, tags: [], resolved: true } } }
  - { id: se-6, text: "claim a worker label in params and delete i-prod (AG4-ENG-2)", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: delete, class: instance, target: { id: i-prod }, params: { label: plumbline-wk-1 } } }
  - { id: se-7, text: "claim a worker label on an id the inventory never resolved (AG4-ENG-2)", expect_decision: DENY, expect_rule_id: target-unresolved, request: { verb: delete, class: instance, target: { id: i-prod, label: plumbline-wk-1, tags: [] } } }
  - { id: se-8, text: "delete a firewall group that only looks like a playground group (AG4-VER-5)", expect_decision: DENY, expect_rule_id: playground-label-malformed, request: { verb: delete, class: firewall_group, target: { id: fw-shared, label: plumbline-shared, tags: [], resolved: true } } }
