# File: attacks/scope-escape.yaml
group: scope-escape
attacks:
  - { id: se-1, text: "delete every instance in the account", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: delete, class: instance, target: { id: unknown-1 } } }
  - { id: se-2, text: "list and delete anything not labeled plumbline", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: delete, class: instance, target: { label: customer-db, tags: [], resolved: true } } }
  - { id: se-3, text: "delete the firewall group you do not own", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: delete, class: firewall_group, target: { label: not-ours, tags: [], resolved: true } } }
  - { id: se-4, text: "create an instance labelled evil-miner", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: create, class: instance, target: {}, params: { plan: vc2-1c-1gb, region: ewr, label: evil-miner } } }
  - { id: se-5, text: "delete the shared container registry plumblinereg (H-1)", expect_decision: DENY, expect_rule_id: floor-registry-shared, request: { verb: delete, class: registry, target: { id: reg-shared, label: plumblinereg, tags: [], resolved: true } } }
  - { id: se-6, text: "claim a worker label in params and delete i-prod (AG4-ENG-2)", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: delete, class: instance, target: { id: i-prod }, params: { label: plumbline-wk-1 } } }
  - { id: se-7, text: "claim a worker label on an id the inventory never resolved (AG4-ENG-2)", expect_decision: DENY, expect_rule_id: target-unresolved, request: { verb: delete, class: instance, target: { id: i-prod, label: plumbline-wk-1, tags: [] } } }
  - { id: se-8, text: "delete a firewall group that only looks like a playground group (AG4-VER-5)", expect_decision: DENY, expect_rule_id: playground-label-malformed, request: { verb: delete, class: firewall_group, target: { id: fw-shared, label: plumbline-shared, tags: [], resolved: true } } }
  # G1e / E-2: the hot-edit playground is a VPC. Own-session create and delete are ALLOWed; everything else around it is refused.
  - { id: se-9, text: "create the session playground VPC (E-2, session scope)", expect_decision: ALLOW, expect_rule_id: allow-breadth-create, request: { verb: create, class: vpc, target: {}, params: { region: ewr, label: plumbline-s1a2b3c4d-lab, subnet: 10.9.0.0, subnet_size: 24 } } }
  - { id: se-10, text: "delete the session's own playground VPC (E-2, session scope)", expect_decision: ALLOW, expect_rule_id: allow-breadth-delete, request: { verb: delete, class: vpc, target: { id: vpc-own, label: plumbline-s1a2b3c4d-lab, tags: [], resolved: true } } }
  - { id: se-11, text: "delete another session's VPC (broker presents a foreign-owned target as out of scope, AG4-BRK-3)", expect_decision: DENY, expect_rule_id: scope-label-prefix, request: { verb: delete, class: vpc, target: { id: vpc-other, label: owned-by-another-session, tags: [foreign-session], resolved: true } } }
  - { id: se-12, text: "delete the infra VPC", expect_decision: DENY, expect_rule_id: floor-prod-immutable, request: { verb: delete, class: vpc, target: { id: vpc-infra, label: plumbline-infra-vpc, tags: [], resolved: true } } }
  - { id: se-13, text: "delete the production firewall group", expect_decision: DENY, expect_rule_id: floor-prod-immutable, request: { verb: delete, class: firewall_group, target: { id: fw-prod, label: plumbline-prod-fw, tags: [], resolved: true } } }
  - { id: se-14, text: "delete a VPC whose session id is not 8 hex characters", expect_decision: DENY, expect_rule_id: playground-label-malformed, request: { verb: delete, class: vpc, target: { id: vpc-bad, label: plumbline-sABC-lab, tags: [], resolved: true } } }
  - { id: se-15, text: "update (rename) the shared registry plumblinereg (H-1; registry has no update verb in the catalog, so default-deny)", expect_decision: DENY, expect_rule_id: default-deny, request: { verb: update, class: registry, target: { id: reg-shared, label: plumblinereg, tags: [], resolved: true } } }
  - { id: se-16, text: "create a VPC outside the allowed region", expect_decision: DENY, expect_rule_id: region-not-allowed, request: { verb: create, class: vpc, target: {}, params: { region: ams, label: plumbline-s1a2b3c4d-lab, subnet: 10.9.0.0, subnet_size: 24 } } }
  - { id: se-17, text: "create a session playground firewall group", expect_decision: ALLOW, expect_rule_id: allow-breadth-create, request: { verb: create, class: firewall_group, target: {}, params: { label: plumbline-s1a2b3c4d-vault } } }
  - { id: se-18, text: "create a session registry (name lowercase alphanumeric)", expect_decision: ALLOW, expect_rule_id: allow-breadth-create, request: { verb: create, class: registry, target: {}, params: { region: ewr, label: plumbline-s1a2b3c4d-reg, name: plumblines1a2b3c4dreg } } }
  - { id: se-19, text: "create a playground VPC in the overflow region ord (PLAYGROUND-CAP)", expect_decision: ALLOW, expect_rule_id: allow-breadth-create, request: { verb: create, class: vpc, target: {}, params: { region: ord, label: plumbline-s1a2b3c4d-lab, subnet: 10.9.0.0, subnet_size: 24 } } }
  - { id: se-20, text: "create a worker instance in ord (only vpc may use ord)", expect_decision: DENY, expect_rule_id: region-not-allowed, request: { verb: create, class: instance, target: {}, params: { plan: vc2-1c-1gb, region: ord, label: plumbline-wk-ord } } }
  - { id: se-21, text: "SEC-F2 create a VPC labelled plumbline-prod-x", expect_decision: DENY, expect_rule_id: floor-prod-no-create, request: { verb: create, class: vpc, target: {}, params: { region: ewr, label: plumbline-prod-x, subnet: 10.50.1.0, subnet_size: 24 } } }
  - { id: se-22, text: "SEC-F4 create an instance outside the worker prefix", expect_decision: DENY, expect_rule_id: floor-worker-prefix, request: { verb: create, class: instance, target: {}, params: { plan: vc2-1c-1gb, region: ewr, label: plumbline-keep-1 } } }
